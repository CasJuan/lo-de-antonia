spring.application.name=lodeAntonia

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/lodeantonia
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del servidor
server.port=8080
